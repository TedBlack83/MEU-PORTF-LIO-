<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Portfólio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
    }
    header, section {
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }
    header {
      background: #222;
      color: #fff;
      text-align: center;
    }
    header img {
      width: 120px;
      border-radius: 50%;
      margin: 20px 0;
    }
    h2 {
      margin-top: 0;
    }
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .project {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .project img {
      width: 100%;
      border-radius: 4px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input, textarea {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    button {
      padding: 10px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Seu Nome</h1>
    <img src="sua-foto.jpg" alt="Sua Foto" />
    <p>"Uma frase de impacto que represente você."</p>
  </header>

  <section>
    <h2>Sobre Mim</h2>
    <p>Sou um profissional apaixonado por tecnologia, criatividade e inovação. Busco sempre novos desafios e oportunidades para crescer.</p>
  </section>

  <section>
    <h2>Projetos</h2>
    <div class="projects">
      <div class="project">
        <img src="projeto1.jpg" alt="Projeto 1" />
        <h3>Projeto 1</h3>
        <p>Descrição do projeto 1.</p>
      </div>
      <div class="project">
        <img src="projeto2.jpg" alt="Projeto 2" />
        <h3>Projeto 2</h3>
        <p>Descrição do projeto 2.</p>
      </div>
      <!-- Adicione até 6 projetos -->
    </div>
  </section>

  <section>
    <h2>Contato</h2>
    <form action="https://formsubmit.co/eliezermotta60@gmail.com" method="POST">
      <input type="text" name="name" placeholder="Nome" required />
      <input type="email" name="email" placeholder="Email" required />
      <textarea name="message" placeholder="Mensagem" rows="5" required></textarea>
      <button type="submit">Enviar</button>
    </form>
  </section>

</body>
</html>
